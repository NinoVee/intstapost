# XcodeGen spec: generate the Xcode project with `xcodegen` (brew install xcodegen).
# One multiplatform target that runs on iPhone, iPad and Mac.
name: ContentStudio
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or pick it in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ContentStudio:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ContentStudio
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        # Change to your own reverse-DNS identifier before signing.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.contentstudio
        PRODUCT_NAME: Content Studio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ContentStudio/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Content Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": ContentStudio/ContentStudio-macOS.entitlements
